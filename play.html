<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1247">
  <meta name="robots" content="noindex">
  <title>Buzzer · Quiz Buzzer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="play">

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <!-- ============ join ============ -->
  <main id="join" class="join-panel card" hidden>
    <h1>Join the quiz</h1>
    <form id="joinForm" autocomplete="off">
      <div class="field">
        <label for="code">Room code</label>
        <input id="code" class="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" required pattern="[A-Za-z0-9]{4}">
      </div>
      <div class="field">
        <label for="name">Your Player ID</label>
        <input id="name" maxlength="24" autocomplete="off" placeholder="Your name or team name" required>
      </div>
      <button class="btn primary big" type="submit">Join</button>
      <p id="joinError" class="error" role="alert"></p>
    </form>
  </main>

  <!-- ============ buzzer ============ -->
  <div id="game" class="game" hidden>
    <div id="offline" class="banner" hidden>Connection lost. Reconnecting…</div>
    <header class="play-top">
      <div class="who"><span id="me"></span><small id="score"></small></div>
      <span class="conn"><span id="dot" class="dot"></span><span id="roomTag"></span></span>
    </header>

    <main class="arena">
      <div class="status" aria-live="polite">
        <h2 id="statusTitle"></h2>
        <p id="statusText"></p>
      </div>
      <button id="buzzer" class="buzzer" type="button" data-mode="wait" aria-label="Buzzer">WAIT</button>
      <button id="leave" class="btn small" type="button">Leave room</button>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/play.js"></script>
</body>
</html>
